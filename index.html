<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Swipe</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--mut:#9a9a9a;--acc:#fe2c55;--bar:#0b0b0b;box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#111;color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
.view{position:absolute;inset:0 0 56px 0;display:none}
.view.on{display:block}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111}
.post video,.post img.m{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}
.info{position:absolute;left:14px;right:84px;bottom:18px}
.info b{font-size:16px}.info p{margin-top:6px;font-size:14px;line-height:1.35}
.side{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.side button{background:none;border:0;color:var(--fg);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.side svg{width:34px;height:34px;fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.side .liked svg{fill:var(--acc);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.35)}}
.av{width:44px;height:44px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:700;font-size:18px;background:#222}
.tabs{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 10px;font-weight:600;font-size:16px;text-shadow:0 1px 3px #0008}
.tabs{gap:24px}.tabs span{color:#ffffffaa;border-bottom:2px solid transparent;padding-bottom:4px;cursor:pointer}.tabs span.on{color:#fff;border-color:#fff}
.uh{display:flex;align-items:center;gap:12px;margin:6px 0 4px;font-size:16px}.uh .av{width:48px;height:48px;font-size:20px;border-width:1px}.uh small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.fbtn{margin-left:auto;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:600 14px inherit;cursor:pointer}.fbtn.on{background:#2a2a2a}
#cfm{position:absolute;inset:0;z-index:80;background:#000a;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
#cfm.on{display:flex;animation:fi .18s}
.cbox{width:100%;max-width:320px;background:#1c1c1e;border:1px solid #2c2c2e;border-radius:22px;padding:26px 22px 18px;text-align:center;box-shadow:0 20px 60px #000b;animation:up .22s cubic-bezier(.2,.9,.3,1.2)}
.cic{width:64px;height:64px;border-radius:50%;background:#fe2c5526;display:grid;place-items:center;margin:0 auto 14px}
.cic svg{width:30px;height:30px;fill:var(--acc)}
.cbox h3{font-size:19px;margin-bottom:6px}
.cbox p{color:var(--mut);font-size:14px;line-height:1.45;margin-bottom:20px}
.cbtns{display:flex;gap:10px}
.cbtns button{flex:1;border:0;border-radius:12px;padding:13px;font:600 15px inherit;cursor:pointer;color:#fff}
#cno{background:#2c2c2e}
#cyes{background:var(--acc)}
@keyframes fi{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(20px) scale(.92)}}
#prog{position:absolute;inset:0;background:#000d;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}#prog.on{display:flex}
.ring{position:relative;width:200px;height:200px}.ring svg{display:block}#pg-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:700}#pg-ring{transition:stroke-dashoffset .2s}
.heart{position:absolute;font-size:90px;transform:translate(-50%,-50%);pointer-events:none;animation:hp .8s forwards}
@keyframes hp{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}60%{opacity:1;transform:translate(-50%,-80%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1.2)}}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bar);border-top:1px solid #222;display:flex;z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button.on{color:#fff}
nav svg{width:24px;height:24px;fill:currentColor}
nav .plus{flex:0 0 56px}
nav .plus i{display:block;width:44px;height:30px;border-radius:9px;background:linear-gradient(90deg,#25f4ee 0 30%,var(--acc) 70%);position:relative}
nav .plus i::after{content:"+";position:absolute;inset:2px 6px;background:#fff;color:#000;border-radius:7px;display:grid;place-items:center;font-size:22px;font-weight:700}
.page{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 20px}
.page h2{font-size:20px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid div{aspect-ratio:3/4;display:grid;place-items:center;font-size:26px;cursor:pointer;background:#1a1a1a center/cover;position:relative;overflow:hidden}
.grid video{width:100%;height:100%;object-fit:cover}
input[type=text],input[type=tel],input[type=password],textarea{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;font:inherit;margin-bottom:10px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 15px inherit;cursor:pointer;width:100%}
.btn.sec{background:#222;margin-bottom:8px}
.btn:disabled{opacity:.5}
.drop{display:block;border:2px dashed #444;border-radius:14px;padding:26px;text-align:center;color:var(--mut);margin-bottom:12px;cursor:pointer}
#prev{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:none}
.prof{text-align:center;padding-top:10px}
.prof .av{width:84px;height:84px;margin:0 auto 10px;font-size:34px;background:linear-gradient(135deg,#25f4ee,#fe2c55)}
.stats{display:flex;justify-content:center;gap:22px;margin:14px 0}
.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:var(--mut)}
.ppl{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #1d1d1d;cursor:pointer}.ppl .av{width:40px;height:40px;font-size:16px;border-width:1px;flex:0 0 auto}.ppl small{color:var(--mut);display:block;font-size:12px}.back{background:#222;border:0;color:#fff;border-radius:16px;padding:6px 12px;font:13px inherit;margin-bottom:10px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:40px 20px;font-size:14px}
#sheet{position:absolute;inset:auto 0 0 0;height:62%;background:#161616;border-radius:18px 18px 0 0;z-index:20;transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheet header{padding:14px;text-align:center;font-weight:600;border-bottom:1px solid #2a2a2a;position:relative}
#sheet header button{position:absolute;right:12px;top:8px;background:none;border:0;color:#fff;font-size:22px}
#cl{flex:1;overflow-y:auto;padding:12px 14px}
#cl p{margin-bottom:12px;font-size:14px}#cl p b{color:var(--mut);margin-right:6px}
#cf{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #2a2a2a}
#cf input{flex:1;background:#222;border:0;border-radius:20px;color:#fff;padding:10px 14px;font:inherit}
#cf button{background:none;border:0;color:var(--acc);font-weight:700}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fffe;color:#000;padding:8px 14px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#auth{position:absolute;inset:0;background:#000;z-index:50;display:none;flex-direction:column;justify-content:center;padding:24px}
#auth.on{display:flex}
#auth h1{font-size:34px;text-align:center;margin-bottom:4px;background:linear-gradient(90deg,#25f4ee,#fe2c55);-webkit-background-clip:text;background-clip:text;color:transparent}
#auth .sub{text-align:center;color:var(--mut);margin-bottom:22px;font-size:14px}
.sw{display:flex;margin-bottom:14px;background:#1a1a1a;border-radius:10px;padding:3px}
.sw button{flex:1;background:none;border:0;color:var(--mut);padding:9px;border-radius:8px;font:600 14px inherit;cursor:pointer}
.sw button.on{background:#333;color:#fff}
.err{color:#ff6b6b;font-size:13px;min-height:18px;margin-bottom:8px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="toast"></div>
  <div id="cfm"><div class="cbox"><div class="cic"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7zM9 3h6l1 2h4v2H4V5h4z"/></svg></div><h3 id="cT">Delete post?</h3><p id="cM">This cannot be undone.</p><div class="cbtns"><button id="cno">Cancel</button><button id="cyes">Delete</button></div></div></div>
  <div id="prog"><div class="ring"><svg viewBox="0 0 120 120" width="200" height="200"><defs><linearGradient id="gr"><stop offset="0" stop-color="#25f4ee"/><stop offset="1" stop-color="#fe2c55"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="none" stroke="#2a2a2a" stroke-width="9"/><circle id="pg-ring" cx="60" cy="60" r="54" fill="none" stroke="url(#gr)" stroke-width="9" stroke-linecap="round" stroke-dasharray="339.292" stroke-dashoffset="339.292" transform="rotate(-90 60 60)"/></svg><div id="pg-txt">0%</div></div><div id="pg-lbl">Uploading…</div></div>

  <div id="auth">
    <h1>Swipe</h1><div class="sub">Sign in with your mobile number</div>
    <div class="sw"><button id="m-in" class="on">Log in</button><button id="m-up">Sign up</button></div>
    <input type="text" id="a-name" placeholder="Your name" style="display:none" autocomplete="name">
    <input type="tel" id="a-mob" placeholder="Mobile number" autocomplete="tel" inputmode="tel">
    <input type="password" id="a-pw" placeholder="Password (min 6 characters)" autocomplete="current-password">
    <div class="err" id="a-err"></div>
    <button class="btn" id="a-go">Log in</button>
  </div>

  <section class="view on" id="v-home">
    <div class="tabs"><span id="t-fl">Following</span><span id="t-for" class="on">For You</span></div>
    <div id="feed"></div>
  </section>

  <section class="view" id="v-search"><div class="page">
    <input type="text" id="q" placeholder="Search users or captions">
    <div id="people"></div><div id="gh" style="font-size:20px;font-weight:700;margin-bottom:12px">Explore</div><div class="grid" id="grid"></div>
  </div></section>

  <section class="view" id="v-up"><div class="page">
    <h2>New post</h2>
    <label class="drop" for="file" id="dz">Tap to choose a video or photo</label>
    <input type="file" id="file" accept="video/*,image/*" hidden>
    <img id="prev" alt=""><video id="pv" controls playsinline muted style="width:100%;max-height:300px;border-radius:12px;margin-bottom:10px;display:none;background:#000"></video>
    <input type="text" id="cap" placeholder="Write a caption…" maxlength="300">
    <button class="btn" id="post">Post</button>
  </div></section>

  <section class="view" id="v-inbox"><div class="page">
    <h2>Activity</h2><div id="notes"></div>
  </div></section>

  <section class="view" id="v-me"><div class="page prof">
    <div class="av" id="me-av">?</div><b id="me-name"></b><div style="color:var(--mut);font-size:13px" id="me-mob"></div>
    <div class="stats"><div><b id="n-posts">0</b><span>Posts</span></div><div><b id="n-fol">0</b><span>Followers</span></div><div><b id="n-fing">0</b><span>Following</span></div><div><b id="n-likes">0</b><span>Likes</span></div></div>
    <button class="btn sec" id="logout">Log out</button>
    <h2 style="margin-top:14px;text-align:left">My posts</h2><div class="grid" id="mine"></div>
  </div></section>

  <div id="sheet"><header>Comments<button id="cx" aria-label="Close">×</button></header><div id="cl"></div>
    <div id="cf"><input id="ci" placeholder="Add a comment…"><button id="cs">Post</button></div></div>

  <nav>
    <button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>Home</button>
    <button data-v="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 5 14l5 5 2-2-5-5A8 8 0 0 0 10 2zm0 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>Discover</button>
    <button data-v="up" class="plus"><i></i></button>
    <button data-v="inbox"><svg viewBox="0 0 24 24"><path d="M3 4h18v14H8l-5 4z"/></svg>Activity</button>
    <button data-v="me"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.500-9 6v2h18v-2c0-3.500-4-6-9-6z"/></svg>Profile</button>
  </nav>
</div>

<script>
const URL_ = "https://jfkocwuaerxnmxuhlyok.supabase.co";
const KEY = "sb_publishable_C6jmy7c8Q60PClOqawXtJg_RNbvR5B3";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function askConfirm(title,msg,ok){return new Promise(res=>{
  const m=document.getElementById("cfm");
  document.getElementById("cT").textContent=title;document.getElementById("cM").textContent=msg;document.getElementById("cyes").textContent=ok||"Delete";
  const done=v=>{m.classList.remove("on");m.onclick=null;document.getElementById("cno").onclick=null;document.getElementById("cyes").onclick=null;res(v)};
  document.getElementById("cno").onclick=()=>done(false);document.getElementById("cyes").onclick=()=>done(true);
  m.onclick=e=>{if(e.target===m)done(false)};
  m.classList.add("on")})}
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n>=1e3?(n/1e3).toFixed(1)+"K":n;
const toast=t=>{const x=$("#toast");x.textContent=t;x.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.opacity=0,2200)};

/* ---------- Supabase REST helpers (no Supabase Auth) ---------- */
const H={apikey:KEY,"Content-Type":"application/json"};
async function api(path,opt={}){
  const r=await fetch(URL_+"/rest/v1/"+path,{...opt,headers:{...H,...(opt.headers||{})}});
  if(!r.ok){let m="Request failed";try{m=(await r.json()).message||m}catch(e){}throw new Error(m)}
  const t=await r.text();return t?JSON.parse(t):null}
const rpc=(fn,body)=>api("rpc/"+fn,{method:"POST",body:JSON.stringify(body)});
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const hashPw=(mob,pw)=>sha("swipe:"+mob+":"+pw);

/* ---------- Session ---------- */
let me=null,posts=[],liked=new Set(),following=new Set(),tab="for",myFollowers=0;
try{me=JSON.parse(localStorage.getItem("swipe_user")||"null")}catch(e){}
const saveMe=()=>{try{me?localStorage.setItem("swipe_user",JSON.stringify(me)):localStorage.removeItem("swipe_user")}catch(e){}};

/* ---------- Auth UI ---------- */
let mode="in";
function setMode(m){mode=m;$("#m-in").classList.toggle("on",m==="in");$("#m-up").classList.toggle("on",m==="up");
  $("#a-name").style.display=m==="up"?"block":"none";$("#a-go").textContent=m==="in"?"Log in":"Create account";$("#a-err").textContent=""}
$("#m-in").onclick=()=>setMode("in");$("#m-up").onclick=()=>setMode("up");
$("#a-go").onclick=async()=>{
  const mob=$("#a-mob").value.replace(/[\s\-+()]/g,""),pw=$("#a-pw").value,name=$("#a-name").value.trim(),err=$("#a-err");
  err.textContent="";
  if(!/^\d{7,15}$/.test(mob)){err.textContent="Enter a valid mobile number (digits only)";return}
  if(pw.length<6){err.textContent="Password must be at least 6 characters";return}
  if(mode==="up"&&!name){err.textContent="Enter your name";return}
  const b=$("#a-go");b.disabled=true;
  try{
    const h=await hashPw(mob,pw);
    const r=mode==="up"?await rpc("signup",{p_mobile:mob,p_name:name,p_hash:h}):await rpc("login",{p_mobile:mob,p_hash:h});
    if(r.error){err.textContent=r.error}else{me=r;saveMe();$("#a-pw").value="";start()}
  }catch(e){err.textContent=e.message}
  b.disabled=false};
$("#logout").onclick=()=>{me=null;liked=new Set();saveMe();posts=[];$("#feed").innerHTML="";$("#auth").classList.add("on");show("home")};

/* ---------- Data ---------- */
async function loadPosts(){
  posts=await api("posts?select=*,likes(count),comments(count)&order=created_at.desc&limit=60");
  const l=await api("likes?select=post_id&user_id=eq."+me.id);
  liked=new Set(l.map(x=>x.post_id));
  try{const f=await api("follows?select=followed_id&follower_id=eq."+me.id);following=new Set(f.map(x=>x.followed_id));
    if(following.size){const more=await api(`posts?select=*,likes(count),comments(count)&user_id=in.(${[...following].join(",")})&order=created_at.desc&limit=60`);mergePosts(more)}
  }catch(e){following=new Set()}
  try{myFollowers=(await api("follows?select=follower_id&followed_id=eq."+me.id)).length}catch(e){}
  render()}
function mergePosts(a){a.forEach(p=>{if(!posts.some(x=>x.id===p.id))posts.push(p)});posts.sort((x,y)=>String(y.created_at).localeCompare(String(x.created_at)))}
const cnt=(p,k)=>(p[k]&&p[k][0]&&p[k][0].count)||0;

/* ---------- Feed ---------- */
const ic={h:'<svg viewBox="0 0 24 24"><path d="M12 21 3.500 12.500A5.500 5.500 0 0 1 12 5.500a5.500 5.500 0 0 1 8.500 7z"/></svg>',
 c:'<svg viewBox="0 0 24 24"><path d="M3 4h18v14H8l-5 4z"/></svg>',
 s:'<svg viewBox="0 0 24 24"><path d="M14 3v5C7 9 4 14 3 20c3-4 6-5 11-5v5l7-8z"/></svg>',
 d:'<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7zM9 3h6l1 2h4v2H4V5h4z"/></svg>'};
async function toggleLike(p,btn){
  const on=!liked.has(p.id);
  on?liked.add(p.id):liked.delete(p.id);
  p.likes=[{count:cnt(p,"likes")+(on?1:-1)}];
  btn.classList.toggle("liked",on);btn.querySelector("span").textContent=fmt(cnt(p,"likes"));
  try{
    if(on)await api("likes",{method:"POST",body:JSON.stringify({post_id:p.id,user_id:me.id})});
    else await api(`likes?post_id=eq.${p.id}&user_id=eq.${me.id}`,{method:"DELETE"});
  }catch(e){toast("Could not save like")}
  stats()}
function card(p){
  const d=document.createElement("div");d.className="post";d.dataset.id=p.id;
  const m=p.media_type==="video"?`<video src="${esc(p.media_url)}" loop playsinline muted></video>`:`<img class="m" src="${esc(p.media_url)}" alt="">`;
  d.innerHTML=m+`<div class="shade"></div>
  <div class="info"><b>@${esc(p.username)}</b><p>${esc(p.caption)}</p></div>
  <div class="side"><div class="av">${esc((p.username||"?")[0].toUpperCase())}</div>
  <button class="lk ${liked.has(p.id)?"liked":""}">${ic.h}<span>${fmt(cnt(p,"likes"))}</span></button>
  <button class="cm">${ic.c}<span>${cnt(p,"comments")}</span></button>
  <button class="sh">${ic.s}<span>Share</span></button>${p.user_id===me.id?`<button class="dl">${ic.d}<span>Delete</span></button>`:""}</div>`;
  const lk=d.querySelector(".lk");
  lk.onclick=()=>toggleLike(p,lk);
  d.querySelector(".cm").onclick=()=>openC(p);
  d.querySelector(".sh").onclick=async()=>{
    try{if(navigator.share)await navigator.share({title:"Swipe",text:p.caption||"",url:location.href});else{await navigator.clipboard.writeText(location.href);toast("Link copied")}}catch(e){}};
  const dl=d.querySelector(".dl");
  if(dl)dl.onclick=async()=>{
    if(!await askConfirm("Delete post?","This post, its likes and comments will be permanently removed. This cannot be undone.","Delete"))return;
    try{
      await api(`posts?id=eq.${p.id}&user_id=eq.${me.id}`,{method:"DELETE"});
      const v=d.querySelector("video");if(v)v.pause();
      const m=(p.media_url||"").split("/object/public/media/")[1];
      if(m)fetch(`${URL_}/storage/v1/object/media/${m}`,{method:"DELETE",headers:{apikey:KEY}}).catch(()=>{});
      posts=posts.filter(x=>x.id!==p.id);
      if(viewUser)viewUser.posts=viewUser.posts.filter(x=>x.id!==p.id);
      d.remove();
      if(!$("#feed .post"))render();else{grids();stats()}
      toast("Post deleted");
    }catch(e){toast("Could not delete: "+e.message)}};
  let last=0;
  d.addEventListener("click",e=>{
    if(e.target.closest(".side"))return;
    const now=Date.now();
    if(now-last<300){const r=d.getBoundingClientRect(),h=document.createElement("div");h.className="heart";h.textContent="❤️";h.style.left=e.clientX-r.left+"px";h.style.top=e.clientY-r.top+"px";d.appendChild(h);setTimeout(()=>h.remove(),800);if(!liked.has(p.id))toggleLike(p,lk)}
    else{const v=d.querySelector("video");if(v)v.paused?v.play():v.pause()}
    last=now});
  return d}
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video");if(!v)return;e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.7});
function render(){
  const f=$("#feed");f.innerHTML="";
  const list=tab==="follow"?posts.filter(p=>following.has(p.user_id)):posts;
  if(!list.length)f.innerHTML=tab==="follow"?'<div class="empty" style="padding-top:35vh">No posts from people you follow.<br>Find people in Discover and tap Follow.</div>':'<div class="empty" style="padding-top:35vh">No posts yet.<br>Tap + to share the first one.</div>';
  list.forEach(p=>{const c=card(p);f.appendChild(c);io.observe(c)});
  grids();stats();notes()}

/* ---------- Comments ---------- */
let cur=null;
async function openC(p){
  cur=p;$("#cl").innerHTML='<p style="color:var(--mut)">Loading…</p>';$("#sheet").classList.add("on");
  try{
    const c=await api(`comments?post_id=eq.${p.id}&order=created_at.asc&select=username,body`);
    $("#cl").innerHTML=c.length?c.map(x=>`<p><b>${esc(x.username)}</b>${esc(x.body)}</p>`).join(""):'<p style="color:var(--mut)">No comments yet.</p>';
  }catch(e){$("#cl").innerHTML='<p style="color:var(--mut)">Could not load comments.</p>'}}
$("#cx").onclick=()=>$("#sheet").classList.remove("on");
$("#cs").onclick=async()=>{
  const v=$("#ci").value.trim();if(!v||!cur)return;$("#ci").value="";
  try{
    await api("comments",{method:"POST",body:JSON.stringify({post_id:cur.id,user_id:me.id,username:me.name,body:v})});
    cur.comments=[{count:cnt(cur,"comments")+1}];
    const b=document.querySelector(`.post[data-id="${cur.id}"] .cm span`);if(b)b.textContent=cnt(cur,"comments");
    openC(cur);
  }catch(e){toast("Could not post comment")}};
$("#ci").onkeydown=e=>{if(e.key==="Enter")$("#cs").click()};

/* ---------- Views ---------- */
function setTab(t){tab=t;$("#t-fl").classList.toggle("on",t==="follow");$("#t-for").classList.toggle("on",t==="for");render();$("#feed").scrollTop=0}
$("#t-fl").onclick=()=>setTab("follow");$("#t-for").onclick=()=>setTab("for");
function show(v){
  $$(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));
  $$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#sheet").classList.remove("on");
  if(v!=="home")$$("video").forEach(x=>x.pause())}
$$("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
const thumb=p=>p.media_type==="video"?`<video src="${esc(p.media_url)}#t=0.1" preload="metadata" muted playsinline></video>`:`<img src="${esc(p.media_url)}" alt="" style="width:100%;height:100%;object-fit:cover">`;
let viewUser=null;
async function openPost(id){
  let p=posts.find(x=>x.id==id);
  if(!p&&viewUser){p=viewUser.posts.find(x=>x.id==id);if(p){posts.push(p);try{const l=await api(`likes?select=post_id&user_id=eq.${me.id}&post_id=eq.${id}`);if(l.length)liked.add(p.id)}catch(e){}}}
  show("home");
  if(tab!=="for")setTab("for");else if(p&&!$(`#feed [data-id="${id}"]`))render();
  const t=$(`#feed [data-id="${id}"]`);if(t)t.scrollIntoView()}
async function toggleFollow(id){
  const on=!following.has(id);
  on?following.add(id):following.delete(id);
  if(viewUser&&viewUser.id===id)viewUser.followers=Math.max(0,(viewUser.followers||0)+(on?1:-1));
  if(on&&viewUser&&viewUser.id===id)mergePosts(viewUser.posts);
  render();
  try{
    if(on)await api("follows",{method:"POST",body:JSON.stringify({follower_id:me.id,followed_id:id})});
    else await api(`follows?follower_id=eq.${me.id}&followed_id=eq.${id}`,{method:"DELETE"});
  }catch(e){on?following.delete(id):following.add(id);if(viewUser&&viewUser.id===id)viewUser.followers=Math.max(0,(viewUser.followers||0)+(on?-1:1));render();toast("Could not update follow. Run the follow SQL in Supabase")}}
async function searchPeople(){
  const q=$("#q").value.trim(),el=$("#people");
  if(!q){el.innerHTML="";return}
  try{
    const r=await rpc("search_users",{p_q:q});
    if($("#q").value.trim()!==q)return;
    el.innerHTML=r.length?'<h2>People</h2>'+r.map(u=>`<div class="ppl" data-id="${esc(u.id)}" data-name="${esc(u.name)}"><div class="av">${esc(u.name[0].toUpperCase())}</div><div><b>${esc(u.name)}</b>${u.id===me.id?"<small>You</small>":following.has(u.id)?"<small>Following</small>":""}</div></div>`).join(""):'<h2>People</h2><div class="empty" style="padding:10px">No users found.</div>';
    $$("#people .ppl").forEach(d=>d.onclick=()=>openUser(d.dataset.id,d.dataset.name))
  }catch(e){el.innerHTML='<div class="empty" style="padding:10px">Search failed: '+esc(e.message)+'</div>'}}
async function openUser(id,name){
  try{
    const ps=await api(`posts?select=*,likes(count),comments(count)&user_id=eq.${id}&order=created_at.desc`);
    let fc=0;try{fc=(await api(`follows?select=follower_id&followed_id=eq.${id}`)).length}catch(e){}
    viewUser={id,name,posts:ps,followers:fc};grids()
  }catch(e){toast("Could not load posts")}}
function grids(){
  const q=($("#q").value||"").toLowerCase();
  const canSee=!viewUser||viewUser.id===me.id||following.has(viewUser.id);
  const src=viewUser?(canSee?viewUser.posts:[]):posts;
  $("#gh").innerHTML=viewUser?`<button class="back" id="bk">← Back</button><div class="uh"><div class="av">${esc(viewUser.name[0].toUpperCase())}</div><div><b>${esc(viewUser.name)}</b><small>${viewUser.posts.length} posts · ${fmt(viewUser.followers||0)} followers</small></div>${viewUser.id!==me.id?`<button class="fbtn ${following.has(viewUser.id)?"on":""}" id="fb">${following.has(viewUser.id)?"Following":"Follow"}</button>`:""}</div>`:"Explore";
  const bk=$("#bk");if(bk)bk.onclick=()=>{viewUser=null;grids()};
  const fb=$("#fb");if(fb)fb.onclick=()=>toggleFollow(viewUser.id);
  const list=src.filter(p=>!q||((p.username||"")+" "+(p.caption||"")).toLowerCase().includes(q));
  $("#grid").innerHTML=list.map(p=>`<div data-id="${p.id}">${thumb(p)}</div>`).join("")||`<div class="empty" style="grid-column:1/-1;aspect-ratio:auto">${viewUser&&!canSee?"Follow "+esc(viewUser.name)+" to see their posts.":"Nothing to show."}</div>`;
  $$("#grid div[data-id]").forEach(d=>d.onclick=()=>openPost(d.dataset.id));
  const mine=posts.filter(p=>p.user_id===me.id);
  $("#mine").innerHTML=mine.map(p=>`<div data-id="${p.id}">${thumb(p)}</div>`).join("")||'<div class="empty" style="grid-column:1/-1;aspect-ratio:auto">No posts yet. Tap + to add one.</div>';
  $$("#mine div[data-id]").forEach(d=>d.onclick=()=>{show("home");const t=$(`#feed [data-id="${d.dataset.id}"]`);if(t)t.scrollIntoView()})}
let qt;$("#q").oninput=()=>{viewUser=null;grids();clearTimeout(qt);qt=setTimeout(searchPeople,300)};
function stats(){
  const mine=posts.filter(p=>p.user_id===me.id);
  $("#n-posts").textContent=mine.length;
  $("#n-fol").textContent=fmt(myFollowers);$("#n-fing").textContent=fmt(following.size);
  $("#n-likes").textContent=mine.reduce((a,p)=>a+cnt(p,"likes"),0)}
async function notes(){
  const el=$("#notes");
  try{
    const c=await api(`comments?select=username,body,created_at,posts!inner(user_id)&posts.user_id=eq.${me.id}&user_id=neq.${me.id}&order=created_at.desc&limit=30`);
    el.innerHTML=c.length?c.map(n=>`<p style="padding:12px 0;border-bottom:1px solid #222;font-size:14px"><b>${esc(n.username)}</b> commented: ${esc(n.body)}</p>`).join(""):'<div class="empty">No activity yet.</div>';
  }catch(e){el.innerHTML='<div class="empty">No activity yet.</div>'}}

/* ---------- Upload ---------- */
let file=null;
function clearPrev(){const p=$("#prev"),v=$("#pv");p.style.display="none";p.removeAttribute("src");v.style.display="none";v.pause();v.removeAttribute("src");v.load();$("#dz").textContent="Tap to choose a video or photo"}
$("#file").onchange=e=>{
  file=e.target.files[0];if(!file)return;
  const u=URL.createObjectURL(file),p=$("#prev"),v=$("#pv");
  if(file.type.startsWith("video/")){p.style.display="none";v.src=u;v.style.display="block"}
  else{v.style.display="none";v.pause();p.src=u;p.style.display="block"}
  $("#dz").textContent="Tap to change"};
const CIRC=2*Math.PI*54;
function setProg(pct,label){$("#pg-ring").style.strokeDashoffset=CIRC*(1-pct/100);$("#pg-txt").textContent=Math.round(pct)+"%";if(label)$("#pg-lbl").textContent=label}
function upload(path,f){return new Promise((res,rej)=>{
  const x=new XMLHttpRequest();x.open("POST",`${URL_}/storage/v1/object/media/${path}`);
  x.setRequestHeader("apikey",KEY);x.setRequestHeader("Content-Type",f.type||"application/octet-stream");
  x.upload.onprogress=e=>{if(e.lengthComputable)setProg(e.loaded/e.total*95)};
  x.onload=()=>{if(x.status>=200&&x.status<300)res();else{let m="Upload failed";try{m=JSON.parse(x.responseText).message||m}catch(e){}rej(new Error(m))}};
  x.onerror=()=>rej(new Error("Network error"));x.send(f)})}
$("#post").onclick=async()=>{
  if(!file){toast("Choose a video or photo first");return}
  if(file.size>50*1024*1024){toast("File is too large (max 50 MB)");return}
  const b=$("#post");b.disabled=true;
  setProg(0,"Uploading…");$("#prog").classList.add("on");
  try{
    const type=file.type.startsWith("video")?"video":"image";
    const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    await upload(path,file);
    setProg(97,"Publishing…");
    await api("posts",{method:"POST",body:JSON.stringify({user_id:me.id,username:me.name,caption:$("#cap").value.trim(),media_url:`${URL_}/storage/v1/object/public/media/${path}`,media_type:type})});
    setProg(100,"Done");await new Promise(r=>setTimeout(r,500));
    file=null;$("#file").value="";$("#cap").value="";clearPrev();
    await loadPosts();show("home");setTab("for");toast("Posted!");
  }catch(e){toast(e.message)}
  $("#prog").classList.remove("on");b.disabled=false};

/* ---------- Start ---------- */
async function start(){
  $("#auth").classList.remove("on");
  $("#me-av").textContent=me.name[0].toUpperCase();$("#me-name").textContent=me.name;$("#me-mob").textContent="+"+me.mobile;
  try{await loadPosts()}catch(e){$("#feed").innerHTML='<div class="empty" style="padding-top:35vh">Could not load posts.<br>Check that the SQL setup was run in Supabase.</div>'}}
if(me&&me.id)start();else $("#auth").classList.add("on");
</script>
