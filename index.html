<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Swipe</title>
<style>
:root{color-scheme:dark;--bg:#0a0a12;--fg:#fff;--mut:#9a9ab0;--acc:#7c5cff;--acc2:#ff6bb5;--like:#ff4d8d;--bar:#0e0e18;box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05050a;color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
.view{position:absolute;inset:0 0 56px 0;display:none}
.view.on{display:block}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111}
.post video,.post img.m{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}
.info{position:absolute;left:14px;right:84px;bottom:18px}
.info b{font-size:16px}.info p{margin-top:6px;font-size:14px;line-height:1.35}
.side{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.side button{background:none;border:0;color:var(--fg);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.side svg{width:34px;height:34px;fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.side .liked svg{fill:var(--acc);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.35)}}
.av{width:44px;height:44px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:700;font-size:18px;background:#222}
.tabs{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 10px;font-weight:600;font-size:16px;text-shadow:0 1px 3px #0008}
.tabs{gap:24px}.tabs span{color:#ffffffaa;border-bottom:2px solid transparent;padding-bottom:4px;cursor:pointer}.tabs span.on{color:#fff;border-color:#fff}
.uh{display:flex;align-items:center;gap:12px;margin:6px 0 4px;font-size:16px}.uh .av{width:48px;height:48px;font-size:20px;border-width:1px}.uh small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.fbtn{margin-left:auto;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:600 14px inherit;cursor:pointer}.fbtn.on{background:#2a2a2a}
#cfm{position:absolute;inset:0;z-index:80;background:#000a;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
#cfm.on{display:flex;animation:fi .18s}
.cbox{width:100%;max-width:320px;background:#1c1c1e;border:1px solid #2c2c2e;border-radius:22px;padding:26px 22px 18px;text-align:center;box-shadow:0 20px 60px #000b;animation:up .22s cubic-bezier(.2,.9,.3,1.2)}
.cic{width:64px;height:64px;border-radius:50%;background:#ff5fa826;display:grid;place-items:center;margin:0 auto 14px}
.cic svg{width:30px;height:30px;fill:var(--acc)}
.cbox h3{font-size:19px;margin-bottom:6px}
.cbox p{color:var(--mut);font-size:14px;line-height:1.45;margin-bottom:20px}
.cbtns{display:flex;gap:10px}
.cbtns button{flex:1;border:0;border-radius:12px;padding:13px;font:600 15px inherit;cursor:pointer;color:#fff}
#cno{background:#2c2c2e}
#cyes{background:var(--acc)}
@keyframes fi{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(20px) scale(.92)}}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:3;background:none;border:0;color:#fff;cursor:pointer;padding:6px}.gear svg{width:26px;height:26px;fill:currentColor;display:block}
.row{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid #1d1d1d;cursor:pointer;font-size:16px}.row .i{width:28px;text-align:center;font-size:20px}.row .ch{margin-left:auto;color:var(--mut)}.row.red{color:#ff5a6e}
.fbtn.msg{margin-left:6px}
.tag{color:#c4b5fd;font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.chips:empty{display:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#1a1a1a;border:1px solid #2c2c2e;border-radius:18px;padding:7px 13px;font-size:13px;color:#c4b5fd;cursor:pointer}
.cv{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #1d1d1d;cursor:pointer}.cv .av{width:48px;height:48px;font-size:19px;border-width:1px;flex:0 0 auto}.cv .t{flex:1;min-width:0}.cv .t b{display:block}.cv .t span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cv time{color:var(--mut);font-size:11px}
#thread{position:absolute;inset:0;z-index:40;background:#000;display:none;flex-direction:column}#thread.on{display:flex}
#thread header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;border-bottom:1px solid #1d1d1d}
#thread header button{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;line-height:1}
#thread .av{width:36px;height:36px;font-size:15px;border-width:1px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--acc);border-bottom-right-radius:5px}
.bub.th{align-self:flex-start;background:#262626;border-bottom-left-radius:5px}
.bub small{display:block;font-size:10px;opacity:.6;margin-top:3px}
#mf{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #1d1d1d}
#mf input{flex:1;background:#1a1a1a;border:0;border-radius:22px;color:#fff;padding:11px 16px;font:inherit}
#mf button{background:var(--acc);border:0;color:#fff;border-radius:22px;padding:0 18px;font:600 14px inherit;cursor:pointer}
#prog{position:absolute;inset:0;background:#000d;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}#prog.on{display:flex}
.ring{position:relative;width:200px;height:200px}.ring svg{display:block}#pg-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:700}#pg-ring{transition:stroke-dashoffset .2s}
.heart{position:absolute;font-size:90px;transform:translate(-50%,-50%);pointer-events:none;animation:hp .8s forwards}
@keyframes hp{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}60%{opacity:1;transform:translate(-50%,-80%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1.2)}}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bar);border-top:1px solid #222;display:flex;z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button.on{color:#fff}
nav svg{width:24px;height:24px;fill:currentColor}
nav .plus{flex:0 0 56px}
nav .plus i{display:block;width:44px;height:30px;border-radius:9px;background:linear-gradient(90deg,#8b6cff 0 30%,var(--acc) 70%);position:relative}
nav .plus i::after{content:"+";position:absolute;inset:2px 6px;background:#fff;color:#000;border-radius:7px;display:grid;place-items:center;font-size:22px;font-weight:700}
.page{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 20px}
.page h2{font-size:20px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid div{aspect-ratio:3/4;display:grid;place-items:center;font-size:26px;cursor:pointer;background:#1a1a1a center/cover;position:relative;overflow:hidden}
.grid video{width:100%;height:100%;object-fit:cover}
input[type=text],input[type=tel],input[type=password],textarea{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;font:inherit;margin-bottom:10px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 15px inherit;cursor:pointer;width:100%}
.btn.sec{background:#222;margin-bottom:8px}
.btn:disabled{opacity:.5}
.drop{display:block;border:2px dashed #444;border-radius:14px;padding:26px;text-align:center;color:var(--mut);margin-bottom:12px;cursor:pointer}
#prev{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:none}
.prof{text-align:center;padding-top:10px}
.prof .av{width:84px;height:84px;margin:0 auto 10px;font-size:34px;background:linear-gradient(135deg,#8b6cff,#ff5fa8)}
.stats{display:flex;justify-content:center;gap:22px;margin:14px 0}
.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:var(--mut)}
.ppl{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #1d1d1d;cursor:pointer}.ppl .av{width:40px;height:40px;font-size:16px;border-width:1px;flex:0 0 auto}.ppl small{color:var(--mut);display:block;font-size:12px}.back{background:#222;border:0;color:#fff;border-radius:16px;padding:6px 12px;font:13px inherit;margin-bottom:10px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:40px 20px;font-size:14px}
#sheet{position:absolute;inset:auto 0 0 0;height:62%;background:#161616;border-radius:18px 18px 0 0;z-index:20;transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheet header{padding:14px;text-align:center;font-weight:600;border-bottom:1px solid #2a2a2a;position:relative}
#sheet header button{position:absolute;right:12px;top:8px;background:none;border:0;color:#fff;font-size:22px}
#cl{flex:1;overflow-y:auto;padding:12px 14px}
#cl p{margin-bottom:12px;font-size:14px}#cl p b{color:var(--mut);margin-right:6px}
#cf{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #2a2a2a}
#cf input{flex:1;background:#222;border:0;border-radius:20px;color:#fff;padding:10px 14px;font:inherit}
#cf button{background:none;border:0;color:var(--acc);font-weight:700}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fffe;color:#000;padding:8px 14px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#auth{position:absolute;inset:0;background:#000;z-index:50;display:none;flex-direction:column;justify-content:center;padding:24px}
#auth.on{display:flex}
#auth h1{font-size:34px;text-align:center;margin-bottom:4px;background:linear-gradient(90deg,#8b6cff,#ff5fa8);-webkit-background-clip:text;background-clip:text;color:transparent}
#auth .sub{text-align:center;color:var(--mut);margin-bottom:22px;font-size:14px}
.sw{display:flex;margin-bottom:14px;background:#1a1a1a;border-radius:10px;padding:3px}
.sw button{flex:1;background:none;border:0;color:var(--mut);padding:9px;border-radius:8px;font:600 14px inherit;cursor:pointer}
.sw button.on{background:#333;color:#fff}
.err{color:#ff6b6b;font-size:13px;min-height:18px;margin-bottom:8px;text-align:center}

/* ===== Aurora theme ===== */
.post::before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:none;z-index:1}
.tabs span{border:0;padding:8px 18px;border-radius:20px;background:#00000066;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:14px;color:#ffffffcc}
.tabs span.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 16px #7c5cff66}
.tabs{gap:8px}
.side{gap:14px}
.side svg{width:50px;height:50px;padding:13px;border-radius:50%;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);fill:#fff;filter:none;border:1px solid #ffffff22}
.side .liked svg{fill:var(--like);background:#ff4d8d33;border-color:#ff4d8d66}
.side button{font-weight:600;text-shadow:0 1px 3px #0008}
.side .av{border:0;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc2)}
.info>b{display:inline-flex;background:#00000066;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:6px 12px;border-radius:16px;font-size:14px}
.info p{font-size:14.5px;text-shadow:0 1px 4px #000a}
nav{background:rgba(14,14,24,.85);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid #ffffff14}
nav button.on svg{fill:#b7a4ff;filter:drop-shadow(0 0 6px #7c5cff99)}
nav button.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--acc2)}
nav .plus{flex:0 0 66px}
nav .plus.on::after{display:none}
nav .plus i{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 20px #7c5cff80;margin-top:-18px;border:3px solid var(--bar)}
nav .plus i::after{inset:0;background:none;color:#fff;border-radius:0;font-size:30px;font-weight:300}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 18px #7c5cff44}
.btn.sec{background:#1c1c2a;box-shadow:none}
.btn:active{transform:scale(.98)}
.fbtn{background:linear-gradient(135deg,var(--acc),var(--acc2))}
input[type=text],input[type=tel],input[type=password],textarea,#cf input,#mf input{background:#15151f;border:1px solid #26263a}
input:focus{outline:0;border-color:var(--acc)}
.sw{background:#15151f}.sw button.on{background:#2a2a40}
.chip{background:#15151f;border-color:#2a2a40}
.drop{border-color:#34345a;background:#11111a}
.grid div{background-color:#15151f;border-radius:6px}
.grid{gap:4px}
.bub.me{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.bub.th{background:#1f1f2e}
#mf button{background:linear-gradient(135deg,var(--acc),var(--acc2))}
#sheet,#thread header{background:#12121c}
#thread{background:var(--bg)}
.cbox{background:#161622;border-color:#2a2a40}
.cic{background:#ff4d6d26}.cic svg{fill:#ff4d6d}#cyes{background:#ff4d6d}#cno{background:#26263a}
.row:active,.cv:active,.ppl:active{background:#ffffff0a}
.stats b{background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.back{background:#1c1c2a}
</style>
</head>
<body>
<div id="app">
  <div id="toast"></div>
  <div id="thread"><header><button id="tb" aria-label="Back">‹</button><div class="av" id="th-av"></div><b id="th-name"></b></header><div id="msgs"></div><div id="mf"><input id="mi" placeholder="Message…" maxlength="1000"><button id="ms">Send</button></div></div>
  <div id="cfm"><div class="cbox"><div class="cic"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7zM9 3h6l1 2h4v2H4V5h4z"/></svg></div><h3 id="cT">Delete post?</h3><p id="cM">This cannot be undone.</p><div class="cbtns"><button id="cno">Cancel</button><button id="cyes">Delete</button></div></div></div>
  <div id="prog"><div class="ring"><svg viewBox="0 0 120 120" width="200" height="200"><defs><linearGradient id="gr"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="none" stroke="#2a2a2a" stroke-width="9"/><circle id="pg-ring" cx="60" cy="60" r="54" fill="none" stroke="url(#gr)" stroke-width="9" stroke-linecap="round" stroke-dasharray="339.292" stroke-dashoffset="339.292" transform="rotate(-90 60 60)"/></svg><div id="pg-txt">0%</div></div><div id="pg-lbl">Uploading…</div></div>

  <div id="auth">
    <h1>Swipe</h1><div class="sub">Sign in with your mobile number</div>
    <div class="sw"><button id="m-in" class="on">Log in</button><button id="m-up">Sign up</button></div>
    <input type="text" id="a-name" placeholder="Your name" style="display:none" autocomplete="name">
    <input type="tel" id="a-mob" placeholder="Mobile number" autocomplete="tel" inputmode="tel">
    <input type="password" id="a-pw" placeholder="Password (min 6 characters)" autocomplete="current-password">
    <div class="err" id="a-err"></div>
    <button class="btn" id="a-go">Log in</button>
  </div>

  <section class="view on" id="v-home">
    <div class="tabs"><span id="t-fl">Following</span><span id="t-for" class="on">For You</span></div>
    <div id="feed"></div>
  </section>

  <section class="view" id="v-search"><div class="page">
    <input type="text" id="q" placeholder="Search users, captions or #tags">
    <div class="chips" id="tags"></div><div id="people"></div><div id="gh" style="font-size:20px;font-weight:700;margin-bottom:12px">Explore</div><div class="grid" id="grid"></div>
  </div></section>

  <section class="view" id="v-up"><div class="page">
    <h2>New post</h2>
    <label class="drop" for="file" id="dz">Tap to choose a video or photo</label>
    <input type="file" id="file" accept="video/*,image/*" hidden>
    <img id="prev" alt=""><video id="pv" controls playsinline muted style="width:100%;max-height:300px;border-radius:12px;margin-bottom:10px;display:none;background:#000"></video>
    <input type="text" id="cap" placeholder="Write a caption… add #tags" maxlength="300">
    <button class="btn" id="post">Post</button>
  </div></section>

  <section class="view" id="v-chat"><div class="page"><h2>Chats</h2><div id="convos"></div></div></section>

  <section class="view" id="v-settings"><div class="page"><button class="back" data-go="me">← Back</button><h2>Settings</h2>
    <div class="row" id="s-pic"><span class="i">📷</span>Change profile picture<span class="ch">›</span></div>
    <div class="row" id="s-act"><span class="i">🔔</span>Activity<span class="ch">›</span></div>
    <div class="row red" id="logout"><span class="i">🚪</span>Log out</div>
    <input type="file" id="avf" accept="image/*" hidden>
  </div></section>

  <section class="view" id="v-act"><div class="page"><button class="back" data-go="settings">← Back</button><h2>Activity</h2><div id="notes"></div></div></section>

  <section class="view" id="v-me"><button class="gear" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button><div class="page prof">
    <div class="av" id="me-av">?</div><b id="me-name"></b><div style="color:var(--mut);font-size:13px" id="me-mob"></div>
    <div class="stats"><div><b id="n-posts">0</b><span>Posts</span></div><div><b id="n-fol">0</b><span>Followers</span></div><div><b id="n-fing">0</b><span>Following</span></div><div><b id="n-likes">0</b><span>Likes</span></div></div>
    <h2 style="margin-top:14px;text-align:left">My posts</h2><div class="grid" id="mine"></div>
  </div></section>

  <div id="sheet"><header>Comments<button id="cx" aria-label="Close">×</button></header><div id="cl"></div>
    <div id="cf"><input id="ci" placeholder="Add a comment…"><button id="cs">Post</button></div></div>

  <nav>
    <button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>Home</button>
    <button data-v="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 5 14l5 5 2-2-5-5A8 8 0 0 0 10 2zm0 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>Discover</button>
    <button data-v="up" class="plus"><i></i></button>
    <button data-v="chat"><svg viewBox="0 0 24 24"><path d="M3 4h18v14H8l-5 4z"/></svg>Chat</button>

    await upload(path,file);
    setProg(97,"Publishing…");
    await api("posts",{method:"POST",body:JSON.stringify({user_id:me.id,username:me.name,caption:$("#cap").value.trim(),media_url:`${URL_}/storage/v1/object/public/media/${path}`,media_type:type})});
    setProg(100,"Done");await new Promise(r=>setTimeout(r,500));
    file=null;$("#file").value="";$("#cap").value="";clearPrev();
    await loadPosts();show("home");setTab("for");toast("Posted!");
  }catch(e){toast(e.message)}
  $("#prog").classList.remove("on");b.disabled=false};

/* ---------- Settings: profile picture ---------- */
function toSquare(file,size=320){return new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d"),m=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);c.toBlob(b=>b?res(b):rej(new Error("Image error")),"image/jpeg",.88)};
  img.onerror=()=>rej(new Error("Could not read image"));img.src=URL.createObjectURL(file)})}
$("#gear").onclick=()=>show("settings");
$$(".back[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$("#s-act").onclick=()=>{show("act");notes()};
$("#s-pic").onclick=()=>$("#avf").click();
$("#avf").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  setProg(0,"Updating photo…");$("#prog").classList.add("on");
  try{
    const b=await toSquare(f);
    const path=`avatars/${me.id}-${Date.now()}.jpg`;
    await upload(path,b);
    setProg(97,"Saving…");
    const url=`${URL_}/storage/v1/object/public/media/${path}`;
    await api("profiles",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:me.id,avatar_url:url})});
    avatars[me.id]=url;setProg(100,"Done");await new Promise(r=>setTimeout(r,400));
    render();show("me");toast("Profile picture updated");
  }catch(err){toast(err.message+" (did you run the profile SQL?)")}
  $("#prog").classList.remove("on")};

/* ---------- Chat ---------- */
let thread=null,tpoll=null,cpoll=null,lastKey="";
const fmtT=d=>{const x=new Date(d),n=new Date();return x.toDateString()===n.toDateString()?x.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):x.toLocaleDateString([],{month:"short",day:"numeric"})};
async function loadConvos(){
  const el=$("#convos");
  try{
    const m=await api(`messages?select=*&or=(sender_id.eq.${me.id},receiver_id.eq.${me.id})&order=created_at.desc&limit=300`);
    const map=new Map();
    m.forEach(x=>{const mine=x.sender_id===me.id,id=mine?x.receiver_id:x.sender_id;if(!map.has(id))map.set(id,{id,name:mine?x.receiver_name:x.sender_name,last:x.body,at:x.created_at,mine})});
    const list=[...map.values()];
    await loadAvatars(list.map(c=>c.id));
    el.innerHTML=list.length?list.map(c=>`<div class="cv" data-id="${esc(c.id)}" data-name="${esc(c.name)}"><div class="av">${avInner(c.id,c.name)}</div><div class="t"><b>${esc(c.name)}</b><span>${c.mine?"You: ":""}${esc(c.last)}</span></div><time>${fmtT(c.at)}</time></div>`).join(""):'<div class="empty">No chats yet.<br>Search a person in Discover, open their profile and tap Message.</div>';
    $$("#convos .cv").forEach(d=>d.onclick=()=>openThread(d.dataset.id,d.dataset.name))
  }catch(e){el.innerHTML='<div class="empty">Chat is not ready. Run the chat SQL in Supabase.<br><small>'+esc(e.message)+'</small></div>'}}
async function openThread(id,name){
  thread={id,name};lastKey="";
  $("#th-name").textContent=name;$("#msgs").innerHTML="";$("#thread").classList.add("on");
  await loadAvatars([id]);$("#th-av").innerHTML=avInner(id,name);
  await loadThread();clearInterval(tpoll);tpoll=setInterval(loadThread,3000)}
function closeThread(){clearInterval(tpoll);thread=null;$("#thread").classList.remove("on");if($("#v-chat").classList.contains("on"))loadConvos()}
async function loadThread(){
  if(!thread)return;const t=thread;
  try{
    const m=await api(`messages?select=id,sender_id,body,created_at&or=(and(sender_id.eq.${me.id},receiver_id.eq.${t.id}),and(sender_id.eq.${t.id},receiver_id.eq.${me.id}))&order=created_at.asc&limit=300`);
    if(!thread||thread.id!==t.id)return;
    const key=m.length+":"+(m.length?m[m.length-1].id:0),first=lastKey==="";
    if(key===lastKey)return;lastKey=key;
    const box=$("#msgs"),near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
    box.innerHTML=m.length?m.map(x=>`<div class="bub ${x.sender_id===me.id?"me":"th"}">${esc(x.body)}<small>${fmtT(x.created_at)}</small></div>`).join(""):'<div class="empty">Say hello 👋</div>';
    if(near||first)box.scrollTop=box.scrollHeight;
  }catch(e){if(lastKey==="")$("#msgs").innerHTML='<div class="empty">Chat is not ready. Run the chat SQL in Supabase.</div>'}}
async function sendMsg(){
  const v=$("#mi").value.trim();if(!v||!thread)return;$("#mi").value="";
  try{
    await api("messages",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({sender_id:me.id,receiver_id:thread.id,sender_name:me.name,receiver_name:thread.name,body:v})});
    lastKey="";await loadThread();
  }catch(e){toast("Could not send message");$("#mi").value=v}}
$("#ms").onclick=sendMsg;$("#mi").onkeydown=e=>{if(e.key==="Enter")sendMsg()};
$("#tb").onclick=closeThread;

/* ---------- Start ---------- */
async function start(){
  $("#auth").classList.remove("on");
  paintMe();$("#me-name").textContent=me.name;$("#me-mob").textContent="+"+me.mobile;
  try{await loadPosts()}catch(e){$("#feed").innerHTML='<div class="empty" style="padding-top:35vh">Could not load posts.<br>Check that the SQL setup was run in Supabase.</div>'}}
if(me&&me.id)start();else $("#auth").classList.add("on");
</script>
</body>
